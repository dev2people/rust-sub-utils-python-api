hosts: {}
proxies: []
proxy-groups:
- name: 代理模式
  proxies:
  - 超时自动换
  - 手工选择
  - 速度最快
  - 负载均衡
  type: select
- disable-udp: false
  lazy: true
  name: 手工选择
  proxies:
  - DIRECT
  timeout: 5000
  type: select
  url: https://www.google.com/generate_204
- disable-udp: false
  interval: 30
  lazy: true
  name: 超时自动换
  proxies:
  - DIRECT
  timeout: 5000
  tolerance: 150
  type: fallback
  url: https://www.google.com/generate_204
- disable-udp: false
  interval: 120
  lazy: true
  name: 速度最快
  proxies:
  - DIRECT
  timeout: 5000
  tolerance: 150
  type: url-test
  url: https://www.google.com/generate_204
- disable-udp: false
  interval: 150
  lazy: true
  name: 负载均衡
  proxies:
  - DIRECT
  strategy: consistent-hashing
  timeout: 5000
  type: load-balance
  url: https://www.google.com/generate_204
- disable-udp: false
  lazy: true
  name: 公司内网
  proxies:
  - DIRECT
  - DIRECT
  timeout: 5000
  type: select
  url: https://www.google.com/generate_204
- disable-udp: false
  lazy: true
  name: 中国安卓app
  proxies:
  - DIRECT
  - 代理模式
  timeout: 5000
  type: select
  url: https://www.google.com/generate_204
- disable-udp: false
  interval: 30
  lazy: true
  name: 美国AI节点
  proxies:
  - DIRECT
  timeout: 5000
  tolerance: 150
  type: fallback
  url: https://www.google.com/generate_204
