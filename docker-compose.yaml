services:
  proxy-sub-transformer-rust:
    restart: unless-stopped
    image: dev2people/proxy-sub-transformer-rust:latest
    ports:
      - "18189:8189"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HTTP_PROXY=http://host.docker.internal:20003
      - HTTPS_PROXY=http://host.docker.internal:20003
      - NO_PROXY=clash-speedtest
      - TZ=Asia/Shanghai
      - DATABASE_URL=sqlite:///app/data/sub.db?mode=rwc
      - RUST_LOG=info
      - JS_TEMPLATE_DIR=./config/js_templates
      - API_AUTH_KEY=epYeobK02c6ee9ELuCkPAplZYyqAjOJN
    depends_on:
      - clash-speedtest

  clash-speedtest:
    restart: unless-stopped
    image: dev2people/clashsub-tools-clashspeedtest-v0
    container_name: clash-speedtest
    networks:
      default:
        aliases:
          - clash-speedtest
    ports:
      - "57890:8080"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
      - AUTH_KEY=epYeobK02c6ee9ELuCkPAplZYyqAjOJN
      - SPEEDTEST_TIMEOUT=1000ms
      - MAX_LATENCY=900ms
#      - RELAY_POOL_URL="https://raw.githubusercontent.com/dev2people/cn-proxy-node-pool/refs/heads/main/filter-data/allnode-url.txt"
#      - RELAY_SUCCESS_COUNT=3
#      - RELAY_SAMPLE_COUNT=20